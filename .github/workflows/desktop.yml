name: Desktop

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    native:
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest, ubuntu-24.04]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.19.0"
                  cache: "npm"
            - uses: dtolnay/rust-toolchain@stable
            - name: Install Linux desktop dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
            - run: npm ci
            - run: npm run test:desktop-contract
            - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
            - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
            - run: npm run tauri:build
            - uses: actions/upload-artifact@v4
              with:
                  name: gamebob-quest-${{ runner.os }}
                  if-no-files-found: error
                  path: |
                      src-tauri/target/release/bundle/**/*.msi
                      src-tauri/target/release/bundle/**/*.exe
                      src-tauri/target/release/bundle/**/*.dmg
                      src-tauri/target/release/bundle/**/*.app
                      src-tauri/target/release/bundle/**/*.deb
                      src-tauri/target/release/bundle/**/*.rpm
                      src-tauri/target/release/bundle/**/*.AppImage
